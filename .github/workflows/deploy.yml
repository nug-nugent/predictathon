name: Deploy to production

# Manual only, by design: this is the first real deploy automation for a live site ~50
# people use, and there's no undo button on an FTP upload. See project memory /
# conversation history for the reasoning - this can move to an automatic trigger later
# once there's confidence in the pipeline.
on:
  workflow_dispatch:

# Prevent two manual runs from racing each other against the same FTP target.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"
  # --- Remote layout (ftp://predictathon.co.uk/) ---
  # Root has data/, logs/, wwwroot/ as siblings. wwwroot is the frontend's site root.
  FRONTEND_REMOTE_PATH: "wwwroot"
  # Confirmed with Hosting Heroes and proven by the real 2026-08-09 go-live deploy: Plesk
  # supports IIS sub-applications, self-service, via Domains -> predictathon.co.uk ->
  # Virtual Directories -> create /api, configured as an Application (not a plain subfolder).
  API_REMOTE_PATH: "wwwroot/api"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Fast, no DB needed. IntegrationTests deliberately excluded - they need a real SQL
      # Server (PREDICTATHON_TEST_CONNECTION) and there's no disposable CI database wired
      # up yet; running them against production would be inappropriate anyway.
      - name: Run backend unit tests
        run: dotnet test UnitTests --configuration Release

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Publish API
        run: dotnet publish WebApi/Predictathon.WebApi.csproj -c Release -o publish/api

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: publish/api
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: app-offline-page
          path: Deployment/app_offline.htm
          retention-days: 7

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Optional extra safety net: create a "production" environment in this repo's Settings
    # -> Environments with a required reviewer, and this job will pause for manual approval
    # even after workflow_dispatch is clicked. Harmless no-op if that environment doesn't exist.
    environment: production
    env:
      FTP_HOST: predictathon.co.uk
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: publish/api

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - uses: actions/download-artifact@v4
        with:
          name: app-offline-page
          path: offline-page

      # Plesk has no per-app/pool environment-variable UI on this host (checked directly during
      # the 2026-08-09 go-live) - secrets are injected straight into the API's own web.config
      # instead, into the <environmentVariables> child of the <aspNetCore> element that
      # dotnet publish auto-generates. IIS blocks direct HTTP access to web.config by default,
      # so this isn't the security downgrade it might sound like. Without this step, the
      # freshly-published web.config this workflow uploads would be missing every secret the
      # app needs to start - see project memory for the outage that caused, the first time this
      # was done by hand.
      - name: Inject production secrets into web.config
        shell: pwsh
        env:
          JWT_SIGNING_KEY: ${{ secrets.PROD_JWT_SIGNING_KEY }}
          CONNECTION_STRING: ${{ secrets.PROD_CONNECTION_STRING }}
          SMTP_HOST: ${{ secrets.PROD_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.PROD_SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.PROD_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.PROD_SMTP_PASSWORD }}
          SMTP_FROM_ADDRESS: ${{ secrets.PROD_SMTP_FROM_ADDRESS }}
          PAYPAL_CLIENT_ID: ${{ secrets.PROD_PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PROD_PAYPAL_CLIENT_SECRET }}
          FOOTBALLDATA_API_KEY: ${{ secrets.PROD_FOOTBALLDATA_API_KEY }}
          HEALTH_API_KEY: ${{ secrets.PROD_HEALTH_API_KEY }}
          HEALTH_DETAILED_API_KEY: ${{ secrets.PROD_HEALTH_DETAILED_API_KEY }}
          SCHEDULED_TASKS_API_KEY: ${{ secrets.PROD_SCHEDULED_TASKS_API_KEY }}
        run: |
          $webConfigPath = "publish/api/web.config"
          [xml]$xml = Get-Content $webConfigPath

          $aspNetCoreNode = $xml.SelectSingleNode("/configuration/system.webServer/aspNetCore")
          if (-not $aspNetCoreNode) {
            throw "Could not find <aspNetCore> in $webConfigPath - dotnet publish output looks unexpected, aborting rather than uploading a broken config."
          }

          $envVarsNode = $aspNetCoreNode.SelectSingleNode("environmentVariables")
          if (-not $envVarsNode) {
            $envVarsNode = $xml.CreateElement("environmentVariables")
            [void]$aspNetCoreNode.AppendChild($envVarsNode)
          }

          function Add-EnvVar([string]$Name, [string]$Value) {
            if ([string]::IsNullOrEmpty($Value)) {
              Write-Warning "No value provided for $Name - web.config will be missing it, same failure mode as forgetting to hand-edit it."
              return
            }
            $node = $xml.CreateElement("environmentVariable")
            $node.SetAttribute("name", $Name)
            $node.SetAttribute("value", $Value)
            [void]$envVarsNode.AppendChild($node)
          }

          Add-EnvVar "ASPNETCORE_ENVIRONMENT" "Production"
          Add-EnvVar "Jwt__SigningKey" $env:JWT_SIGNING_KEY
          Add-EnvVar "ConnectionStrings__DefaultConnection" $env:CONNECTION_STRING
          Add-EnvVar "Smtp__Host" $env:SMTP_HOST
          Add-EnvVar "Smtp__Port" $env:SMTP_PORT
          Add-EnvVar "Smtp__Username" $env:SMTP_USERNAME
          Add-EnvVar "Smtp__Password" $env:SMTP_PASSWORD
          Add-EnvVar "Smtp__FromAddress" $env:SMTP_FROM_ADDRESS
          # This host's mail server doesn't support TLS on the configured port - see project
          # memory for the SmtpException that pinned this down.
          Add-EnvVar "Smtp__EnableSsl" "false"
          Add-EnvVar "PayPal__ClientId" $env:PAYPAL_CLIENT_ID
          Add-EnvVar "PayPal__ClientSecret" $env:PAYPAL_CLIENT_SECRET
          Add-EnvVar "FootballDataApi__ApiKey" $env:FOOTBALLDATA_API_KEY
          # Leaving these unset makes /health, /health/detailed, and the scheduled-task trigger
          # endpoints unauthenticated - low risk (idempotent, no sensitive data) but worth setting.
          Add-EnvVar "Health__ApiKey" $env:HEALTH_API_KEY
          Add-EnvVar "Health__DetailedApiKey" $env:HEALTH_DETAILED_API_KEY
          Add-EnvVar "ScheduledTasks__ApiKey" $env:SCHEDULED_TASKS_API_KEY
          # TEMPORARY: Serilog's file sink can't write to the external data/logs folder (suspected
          # app-pool-identity permissions issue on this host, never fully diagnosed - see project
          # memory). Pointing it in-tree instead means logs work but don't survive a republish.
          # Remove this override once the external folder's permissions are sorted.
          Add-EnvVar "Serilog__WriteTo__0__Args__path" ".\logs\predictathon-.log"

          $xml.Save($webConfigPath)
          Write-Host "Injected environment variables into $webConfigPath"

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # Mirrors Deployment/Publish-Local.ps1's sequence exactly, just swapping local
      # Copy-Item/robocopy for FTPS. See that script + README.md's "Production deployment"
      # section for the reasoning behind each step.
      - name: Take site offline
        run: |
          lftp -e "set ssl:verify-certificate no; set ftp:ssl-force true; set ftp:ssl-protect-data true; \
            put offline-page/app_offline.htm -o $API_REMOTE_PATH/app_offline.htm; \
            put offline-page/app_offline.htm -o $FRONTEND_REMOTE_PATH/index.html; \
            bye" -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_HOST"

      # ANCM needs a moment to unload the running app and release its file locks on the
      # published DLLs before they can be overwritten - same reason Publish-Local.ps1 sleeps
      # here, just a longer pause since this is over the network rather than a local copy.
      - name: Wait for ANCM to release file locks
        run: sleep 10

      # Upload only - deliberately NOT a delete-extra-files mirror. This preserves
      # app_offline.htm (not part of the publish output) exactly like a local
      # `dotnet publish -o` into an existing folder would, and avoids any risk of an
      # overly broad delete reaching into a sibling folder we don't fully control the
      # layout of yet (see API_REMOTE_PATH TODO above). Trade-off: stale files from old
      # deploys aren't cleaned up automatically - acceptable for now, revisit once the
      # real remote layout is confirmed.
      - name: Upload API
        run: |
          lftp -e "set ssl:verify-certificate no; set ftp:ssl-force true; set ftp:ssl-protect-data true; \
            mirror -R --verbose --parallel=4 publish/api $API_REMOTE_PATH; \
            bye" -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_HOST"

      # Bring the API back online before the frontend, so there's no window where a live
      # SPA is talking to an API still serving 503s.
      - name: Bring API online
        run: |
          lftp -e "set ssl:verify-certificate no; set ftp:ssl-force true; set ftp:ssl-protect-data true; \
            rm -f $API_REMOTE_PATH/app_offline.htm; \
            bye" -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_HOST"

      - name: Upload frontend
        run: |
          lftp -e "set ssl:verify-certificate no; set ftp:ssl-force true; set ftp:ssl-protect-data true; \
            mirror -R --verbose --parallel=4 frontend/dist $FRONTEND_REMOTE_PATH; \
            bye" -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_HOST"

      # Belt-and-braces final copy, matching Publish-Local.ps1's own paranoia: the mirror
      # above should already have restored the real index.html, but this one file is the
      # difference between the site being up and stuck on the offline page, so don't rely
      # on mirror's same-file heuristics for it.
      - name: Restore real index.html
        run: |
          lftp -e "set ssl:verify-certificate no; set ftp:ssl-force true; set ftp:ssl-protect-data true; \
            put frontend/dist/index.html -o $FRONTEND_REMOTE_PATH/index.html; \
            bye" -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_HOST"

# Not covered here, deliberately: database schema changes (dacpac/sqlpackage). Per David's
# call, that stays a separate manual step for now given the first release includes the
# dbo.User -> Identity.Users migration against real production data - see project memory
# ("Schema deploy" decision) before automating it into this workflow.
#
# TODO: evaluate Web Deploy as a replacement for the FTPS/lftp approach above. Plesk has it
# available on this host (Domains -> predictathon.co.uk -> Web Scripting -> "Web Deploy
# publishing" checkbox, which then exposes a "Web Deploy Publish settings" .publishsettings
# download) - found during the 2026-08-09 go-live but deliberately not adopted mid-cutover.
# Worth it if it pans out: native web.config "parameterization" could replace the whole
# secrets-injection step above with Web Deploy's own built-in mechanism, and
# EnableMSDeployAppOffline could replace the hand-rolled offline/online lftp dance entirely.
# Needs a windows-latest runner (msdeploy tooling), the .publishsettings contents as new
# secrets, and - the one genuinely unresolved question - confirmation that Plesk's Web Deploy
# scope reaches the nested /api sub-application, or whether it needs two separate syncs (site
# root + sub-app). Test this for real against the live host before switching, not blind.

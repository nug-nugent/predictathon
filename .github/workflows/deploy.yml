name: Deploy to production

# Manual only, by design: this is deploy automation for a live site ~50 people use, and
# there's no undo button on a production sync. See project memory / conversation history for
# the reasoning - this can move to an automatic trigger later once there's confidence in the
# pipeline.
on:
  workflow_dispatch:

# Prevent two manual runs from racing each other against the same target.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Fast, no DB needed. IntegrationTests deliberately excluded - they need a real SQL
      # Server (PREDICTATHON_TEST_CONNECTION) and there's no disposable CI database wired
      # up yet; running them against production would be inappropriate anyway.
      - name: Run backend unit tests
        run: dotnet test UnitTests --configuration Release

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Publish API
        run: dotnet publish WebApi/Predictathon.WebApi.csproj -c Release -o publish/api

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # MSBuild.Sdk.SqlProj nests dacpac output under a target-framework subfolder like a normal
      # class library would (Database/bin/Release/net10.0/Predictathon.Database.dacpac) - unlike
      # the classic SSDT .sqlproj SDK's flattened layout an earlier version of this comment
      # assumed. Confirmed against a real local build, not a guess.
      - name: Build database dacpac
        run: dotnet build Database/Predictathon.Database.csproj -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: publish/api
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: app-offline-page
          path: Deployment/app_offline.htm
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: database-dacpac
          path: Database/bin/Release/net10.0/Predictathon.Database.dacpac
          retention-days: 7

  deploy:
    needs: build-and-test
    # msdeploy.exe is Windows-only client tooling - unlike the earlier FTPS approach, this job
    # can't run on ubuntu-latest. GitHub's windows-latest images are expected to include Web
    # Deploy already (part of the standard VS Build Tools toolset) - the "Locate msdeploy.exe"
    # step below fails loudly rather than assuming, in case that expectation is wrong.
    runs-on: windows-latest
    timeout-minutes: 20
    # Optional extra safety net: create a "production" environment in this repo's Settings
    # -> Environments with a required reviewer, and this job will pause for manual approval
    # even after workflow_dispatch is clicked. Harmless no-op if that environment doesn't exist.
    environment: production
    env:
      # From the "Web Deploy Publish settings" .publishsettings file Plesk generates once
      # "Web Deploy publishing" is ticked under Domains -> predictathon.co.uk -> Web Scripting.
      # WEBDEPLOY_SERVICE_URL = the <publishProfile>'s publishUrl attribute.
      # WEBDEPLOY_SITE = its msdeploySite attribute - this is the site name; the API's IIS app
      # path is "$WEBDEPLOY_SITE/api" (confirmed working 2026-08-10 - see project memory), the
      # frontend's is $WEBDEPLOY_SITE on its own.
      MSDEPLOY_SERVICE_URL: ${{ secrets.WEBDEPLOY_SERVICE_URL }}
      MSDEPLOY_SITE: ${{ secrets.WEBDEPLOY_SITE }}
      MSDEPLOY_USERNAME: ${{ secrets.WEBDEPLOY_USERNAME }}
      MSDEPLOY_PASSWORD: ${{ secrets.WEBDEPLOY_PASSWORD }}
    steps:
      # Needed for Database/Predictathon.publish.xml (the sqlpackage profile) further down -
      # nothing else in this job previously needed the repo checked out.
      - uses: actions/checkout@v4

      # For the "dotnet tool install microsoft.sqlpackage" step below. windows-latest ships a
      # preinstalled SDK, but pinning the same version as the rest of the pipeline avoids relying
      # on whatever happens to be preinstalled.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: publish/api

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - uses: actions/download-artifact@v4
        with:
          name: app-offline-page
          path: offline-page

      - uses: actions/download-artifact@v4
        with:
          name: database-dacpac
          path: database-dacpac

      # Plesk has no per-app/pool environment-variable UI on this host (checked directly during
      # the 2026-08-09 go-live) - secrets are injected straight into the API's own web.config
      # instead, into the <environmentVariables> child of the <aspNetCore> element that
      # dotnet publish auto-generates. IIS blocks direct HTTP access to web.config by default,
      # so this isn't the security downgrade it might sound like.
      #
      # This step is unchanged from the FTPS version of this workflow, still needed even with
      # Web Deploy: MSDeploy's own "parameterization" mechanism could in principle replace it
      # (substituting values into web.config as part of the sync itself, without ever baking
      # secrets into the published output at all), but that needs a purpose-built parameters.xml
      # matching this project's auto-generated <environmentVariables> structure, which has not
      # been attempted or verified - a real design task for another day, not bolted on blind
      # here. Editing the file directly first, like this, is the same proven approach either way.
      - name: Inject production secrets into web.config
        shell: pwsh
        env:
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          CONNECTION_STRING: ${{ secrets.CONNECTION_STRING }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_ADDRESS: ${{ secrets.SMTP_FROM_ADDRESS }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          FOOTBALLDATA_API_KEY: ${{ secrets.FOOTBALLDATA_API_KEY }}
          HEALTH_DETAILED_API_KEY: ${{ secrets.HEALTH_DETAILED_API_KEY }}
          SCHEDULED_TASKS_API_KEY: ${{ secrets.SCHEDULED_TASKS_API_KEY }}
        run: |
          $webConfigPath = "publish/api/web.config"
          [xml]$xml = Get-Content $webConfigPath

          $aspNetCoreNode = $xml.SelectSingleNode("/configuration/system.webServer/aspNetCore")
          if (-not $aspNetCoreNode) {
            throw "Could not find <aspNetCore> in $webConfigPath - dotnet publish output looks unexpected, aborting rather than uploading a broken config."
          }

          $envVarsNode = $aspNetCoreNode.SelectSingleNode("environmentVariables")
          if (-not $envVarsNode) {
            $envVarsNode = $xml.CreateElement("environmentVariables")
            [void]$aspNetCoreNode.AppendChild($envVarsNode)
          }

          function Add-EnvVar([string]$Name, [string]$Value) {
            if ([string]::IsNullOrEmpty($Value)) {
              Write-Warning "No value provided for $Name - web.config will be missing it, same failure mode as forgetting to hand-edit it."
              return
            }
            $node = $xml.CreateElement("environmentVariable")
            $node.SetAttribute("name", $Name)
            $node.SetAttribute("value", $Value)
            [void]$envVarsNode.AppendChild($node)
          }

          Add-EnvVar "ASPNETCORE_ENVIRONMENT" "Production"
          Add-EnvVar "Jwt__SigningKey" $env:JWT_SIGNING_KEY
          Add-EnvVar "ConnectionStrings__DefaultConnection" $env:CONNECTION_STRING
          Add-EnvVar "Smtp__Host" $env:SMTP_HOST
          Add-EnvVar "Smtp__Port" $env:SMTP_PORT
          Add-EnvVar "Smtp__Username" $env:SMTP_USERNAME
          Add-EnvVar "Smtp__Password" $env:SMTP_PASSWORD
          Add-EnvVar "Smtp__FromAddress" $env:SMTP_FROM_ADDRESS
          # This host's mail server doesn't support TLS on the configured port - see project
          # memory for the SmtpException that pinned this down.
          Add-EnvVar "Smtp__EnableSsl" "false"
          Add-EnvVar "PayPal__ClientId" $env:PAYPAL_CLIENT_ID
          Add-EnvVar "PayPal__ClientSecret" $env:PAYPAL_CLIENT_SECRET
          Add-EnvVar "FootballDataApi__ApiKey" $env:FOOTBALLDATA_API_KEY
          # Health__ApiKey is deliberately never set here - David's call, keeps the plain /health
          # check publicly reachable (e.g. for basic uptime pings with no secret needed), while
          # Health__DetailedApiKey still gates whatever /health/detailed exposes beyond that.
          Add-EnvVar "Health__DetailedApiKey" $env:HEALTH_DETAILED_API_KEY
          Add-EnvVar "ScheduledTasks__ApiKey" $env:SCHEDULED_TASKS_API_KEY
          # TEMPORARY: Serilog's file sink can't write to the external data/logs folder (suspected
          # app-pool-identity permissions issue on this host, never fully diagnosed - see project
          # memory). Pointing it in-tree instead means logs work but don't survive a republish.
          # Remove this override once the external folder's permissions are sorted.
          Add-EnvVar "Serilog__WriteTo__0__Args__path" ".\logs\predictathon-.log"

          $xml.Save($webConfigPath)
          Write-Host "Injected environment variables into $webConfigPath"

      # windows-latest is expected to already have this (see the runs-on comment above) - fail
      # clearly here rather than let a later step die on a cryptic "command not found".
      - name: Locate msdeploy.exe
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\IIS\Microsoft Web Deploy V3\msdeploy.exe",
            "${env:ProgramFiles(x86)}\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) {
            $onPath = Get-Command msdeploy.exe -ErrorAction SilentlyContinue
            if ($onPath) { $found = $onPath.Source }
          }
          if (-not $found) {
            throw "msdeploy.exe not found on this runner. Expected it as part of windows-latest's standard toolset - that assumption may be wrong. Install the Web Deploy client tooling as an earlier step if so."
          }
          Write-Host "Using msdeploy.exe at $found"
          "MSDEPLOY_EXE=$found" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # --- Everything from here down is the live-site window: both apps go offline before any
      # content or schema change touches them, and neither comes back until its own work (and,
      # for the API, the DB migration too) is fully done. See project memory / conversation
      # history for why this replaced the old "-enableRule:AppOffline per sync" approach: that
      # rule only keeps a given sync's own target offline for the duration of that one command,
      # which reopened the API to live traffic before the DB migration had even run.

      # Every -dest: argument below is built as its own PowerShell string variable first, then
      # passed to msdeploy.exe as a single bare token - NOT written inline as adjacent quoted/
      # unquoted fragments at the call site. The inline form (multiple "..." segments joined by
      # literal commas, right next to `-dest:contentPath=` with no separating whitespace) is a
      # known PowerShell-calling-a-native-exe trap: PowerShell's own re-quoting of that composite
      # token for the child process's command line does not reliably match what msdeploy (a
      # native CommandLineToArgvW-based tool) expects, and it broke on the very first real run
      # of this workflow with "Unrecognized argument ... All arguments must begin with '-'." -
      # msdeploy received a single mangled argument starting with a stray quote instead of '-'.
      # Building the full value as one pre-computed string and passing that bare variable avoids
      # the ambiguity, since PowerShell only has one token to marshal, not several to reconcile.
      # Frontend has no ASP.NET Core Module to detect app_offline.htm natively (it's static
      # files) - overwriting index.html directly is the reliable mechanism (see README.md /
      # project memory for why the obvious rewrite-rule approach isn't).
      - name: Take frontend offline
        shell: pwsh
        run: |
          $destArg = '-dest:contentPath="{0}/index.html",computerName="{1}",userName="{2}",password="{3}",authtype="Basic"' -f $env:MSDEPLOY_SITE, $env:MSDEPLOY_SERVICE_URL, $env:MSDEPLOY_USERNAME, $env:MSDEPLOY_PASSWORD
          & $env:MSDEPLOY_EXE -verb:sync -source:contentPath="offline-page\app_offline.htm" $destArg -allowUntrusted
          if ($LASTEXITCODE -ne 0) { throw "msdeploy offline-page sync (frontend) failed with exit code $LASTEXITCODE" }

      # Placed manually (not via -enableRule:AppOffline) so it stays in place across the API
      # content sync AND the DB migration below, instead of msdeploy auto-removing it the moment
      # the API's own sync step finishes. ANCM detects the file natively - no config needed.
      - name: Take API offline
        shell: pwsh
        run: |
          $destArg = '-dest:contentPath="{0}/api/app_offline.htm",computerName="{1}",userName="{2}",password="{3}",authtype="Basic"' -f $env:MSDEPLOY_SITE, $env:MSDEPLOY_SERVICE_URL, $env:MSDEPLOY_USERNAME, $env:MSDEPLOY_PASSWORD
          & $env:MSDEPLOY_EXE -verb:sync -source:contentPath="offline-page\app_offline.htm" $destArg -allowUntrusted
          if ($LASTEXITCODE -ne 0) { throw "msdeploy offline-page sync (API) failed with exit code $LASTEXITCODE" }
          # In-process hosting: ANCM needs a moment to unload the app and release its file locks
          # on the published DLLs before the sync below can overwrite them (same rationale as
          # Publish-Local.ps1's identical sleep).
          Start-Sleep -Seconds 3

      # -skip prevents this sync's default "delete anything at the destination that isn't in the
      # source" behaviour from deleting the app_offline.htm placed just above (it's deliberately
      # not part of the published API output). Do not remove -skip or add -enableRule:AppOffline
      # back here - either would let the API answer live requests before the DB migration below
      # has run against the (still old) schema.
      - name: Sync API
        shell: pwsh
        run: |
          $destArg = '-dest:contentPath="{0}/api",computerName="{1}",userName="{2}",password="{3}",authtype="Basic"' -f $env:MSDEPLOY_SITE, $env:MSDEPLOY_SERVICE_URL, $env:MSDEPLOY_USERNAME, $env:MSDEPLOY_PASSWORD
          & $env:MSDEPLOY_EXE -verb:sync -source:contentPath="publish\api" $destArg -allowUntrusted -skip:objectName=filePath,absolutePath="app_offline\.htm"
          if ($LASTEXITCODE -ne 0) { throw "msdeploy sync of the API failed with exit code $LASTEXITCODE" }

      # Schema deploy, now automated (previously a deliberate manual step - see project memory).
      # Runs while both apps are offline, so nothing is ever live against a mismatched schema.
      # CONNECTION_STRING is the same production connection string the app itself uses - if that
      # SQL login lacks DDL rights this step fails cleanly here, before either app comes back
      # online, rather than corrupting anything silently.
      - name: Install SqlPackage
        shell: pwsh
        run: |
          dotnet tool install -g microsoft.sqlpackage
          # windows-latest images add this to PATH already in practice, but that's an assumption
          # about the runner image, not a guarantee - make it explicit so this step can't leave
          # "sqlpackage" unresolved for the steps below.
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Script database migration (audit trail)
        shell: pwsh
        env:
          CONNECTION_STRING: ${{ secrets.CONNECTION_STRING }}
        run: |
          sqlpackage /Action:Script `
            /SourceFile:"database-dacpac\Predictathon.Database.dacpac" `
            /TargetConnectionString:"$env:CONNECTION_STRING" `
            /OutputPath:"migration-script.sql" `
            /Profile:"Database\Predictathon.publish.xml" `
            /p:ExcludeObjectTypes="Users;RoleMembership;DatabaseRoles;Permissions"
          if ($LASTEXITCODE -ne 0) { throw "sqlpackage /Action:Script failed with exit code $LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        with:
          name: migration-script
          path: migration-script.sql
          retention-days: 90

      - name: Publish database migration
        shell: pwsh
        env:
          CONNECTION_STRING: ${{ secrets.CONNECTION_STRING }}
        run: |
          sqlpackage /Action:Publish `
            /SourceFile:"database-dacpac\Predictathon.Database.dacpac" `
            /TargetConnectionString:"$env:CONNECTION_STRING" `
            /Profile:"Database\Predictathon.publish.xml" `
            /p:ExcludeObjectTypes="Users;RoleMembership;DatabaseRoles;Permissions"
          if ($LASTEXITCODE -ne 0) { throw "sqlpackage /Action:Publish failed with exit code $LASTEXITCODE - schema not fully applied, site deliberately left offline. Check migration-script.sql (uploaded above) to see what was attempted." }

      # Only now that the schema matches what the new API code expects does the API come back.
      - name: Bring API online
        shell: pwsh
        run: |
          $destArg = '-dest:contentPath="{0}/api/app_offline.htm",computerName="{1}",userName="{2}",password="{3}",authtype="Basic"' -f $env:MSDEPLOY_SITE, $env:MSDEPLOY_SERVICE_URL, $env:MSDEPLOY_USERNAME, $env:MSDEPLOY_PASSWORD
          & $env:MSDEPLOY_EXE -verb:delete $destArg -allowUntrusted
          if ($LASTEXITCODE -ne 0) { throw "msdeploy delete of API app_offline.htm failed with exit code $LASTEXITCODE" }

      # msdeploy's contentPath sync deletes destination files not present in the source by
      # default (unlike lftp's default, which is why the FTPS version never needed this flag).
      # wwwroot/api is nested under the frontend's own site root and is NOT part of frontend/dist
      # - without -enableRule:DoNotDeleteRule, this step would delete the entire API on every
      # deploy. Do not remove this flag.
      - name: Sync frontend
        shell: pwsh
        run: |
          $destArg = '-dest:contentPath="{0}",computerName="{1}",userName="{2}",password="{3}",authtype="Basic"' -f $env:MSDEPLOY_SITE, $env:MSDEPLOY_SERVICE_URL, $env:MSDEPLOY_USERNAME, $env:MSDEPLOY_PASSWORD
          & $env:MSDEPLOY_EXE -verb:sync -source:contentPath="frontend\dist" $destArg -allowUntrusted -enableRule:DoNotDeleteRule
          if ($LASTEXITCODE -ne 0) { throw "msdeploy sync of the frontend failed with exit code $LASTEXITCODE" }

      # Belt-and-braces final copy, matching Publish-Local.ps1's own paranoia: the sync above
      # should already have restored the real index.html, but this one file is the difference
      # between the site being up and stuck on the offline page, so don't rely on msdeploy's
      # own change-detection heuristics for it. This is the last step - the site is back online
      # once it completes.
      - name: Restore real index.html
        shell: pwsh
        run: |
          $destArg = '-dest:contentPath="{0}/index.html",computerName="{1}",userName="{2}",password="{3}",authtype="Basic"' -f $env:MSDEPLOY_SITE, $env:MSDEPLOY_SERVICE_URL, $env:MSDEPLOY_USERNAME, $env:MSDEPLOY_PASSWORD
          & $env:MSDEPLOY_EXE -verb:sync -source:contentPath="frontend\dist\index.html" $destArg -allowUntrusted
          if ($LASTEXITCODE -ne 0) { throw "msdeploy final index.html restore failed with exit code $LASTEXITCODE" }

# Required GitHub Environment secrets on "production":
# WEBDEPLOY_SERVICE_URL, WEBDEPLOY_SITE, WEBDEPLOY_USERNAME, WEBDEPLOY_PASSWORD (from the
# .publishsettings file's <publishProfile> attributes: publishUrl, msdeploySite, userName,
# userPWD respectively), plus JWT_SIGNING_KEY, CONNECTION_STRING, SMTP_*, PAYPAL_*,
# FOOTBALLDATA_API_KEY, HEALTH_DETAILED_API_KEY, SCHEDULED_TASKS_API_KEY.
#
# Database schema deploy is now part of this workflow (sqlpackage, using the checked-in
# Database/Predictathon.publish.xml profile - BlockOnPossibleDataLoss=True and
# DropObjectsNotInSource=True, already vetted against real production data on 2026-08-10).
# It reuses the CONNECTION_STRING secret as the sqlpackage target - that SQL login needs DDL
# rights (CREATE/ALTER/DROP), not just the DML the app itself needs at runtime; confirm that
# before the first real trigger.

<!--
Used two ways:

1. Automatically, by .github/workflows/deploy.yml and Deployment/Publish-Local.ps1 - both pull
   this file in and copy it to the two locations below as part of a deploy, so an upgrade takes
   the site offline (and back online) without any manual step.
2. Manually, for a longer/planned upgrade: copy this file, named exactly "app_offline.htm", into:
     a. The API's IIS sub-application folder (content root of the published WebApi output). The
        ASP.NET Core Module (ANCM) detects it automatically, shuts the app down, and serves this
        file's contents (with a 503) for every request - no IIS/web.config changes needed.
     b. The frontend's site root, as index.html specifically (not alongside it - see README.md's
        "Taking the site offline for an upgrade" section for why a separate app_offline.htm
        doesn't work reliably for the frontend the way it does for the API).
   To bring the site back up by hand, restore the real published output for both.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Predictathon - Upgrading</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
  }
  main {
    max-width: 480px;
    padding: 32px 24px;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 12px;
  }
  p {
    font-size: 1rem;
    line-height: 1.5;
    color: #94a3b8;
    margin: 0;
  }
</style>
</head>
<body>
<main>
  <h1>Predictathon is being upgraded</h1>
  <p>Predictathon is being upgraded and should be back again shortly. Thanks for your patience.</p>
</main>
</body>
</html>

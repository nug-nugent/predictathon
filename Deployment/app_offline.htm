<!--
Template only - not deployed automatically by any build step.

To take the site down for an upgrade, copy this file, named exactly "app_offline.htm", into:
  1. The API's IIS sub-application folder (content root of the published WebApi output). The
     ASP.NET Core Module (ANCM) detects it automatically, shuts the app down, and serves this
     file's contents (with a 503) for every request - no IIS/web.config changes needed.
  2. The frontend's site root (alongside index.html). The frontend is static files with no
     ANCM in play, so frontend/public/web.config carries a URL Rewrite rule that checks for this
     file and serves it if present, mirroring ANCM's behaviour there.

To bring the site back up, delete (or rename) both copies.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Predictathon - Upgrading</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
  }
  main {
    max-width: 480px;
    padding: 32px;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 12px;
  }
  p {
    font-size: 1rem;
    line-height: 1.5;
    color: #94a3b8;
    margin: 0;
  }
</style>
</head>
<body>
<main>
  <h1>Predictathon is being upgraded</h1>
  <p>Predictathon is being upgraded, and will likely be offline for a day or more. Thanks for your patience - normal service will resume soon.</p>
</main>
</body>
</html>

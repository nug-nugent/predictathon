<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Predictathon - football score prediction leagues</title>
    <meta name="description" content="Predict the scores, beat your mates. Prediction leagues for the Premier League, World Cup and Euros - climb the table and take the bragging rights since 1998." />

    <!--
      The app is a client-rendered SPA and every route is served the same index.html (see
      public/web.config's SPA fallback), so these tags are static and always describe the site
      root. That is correct here precisely because "/" - the logged-out landing/login page - is
      the only page a crawler can reach; everything else is behind auth. A site with more than
      one indexable page would need these set per-route instead.
    -->
    <link rel="canonical" href="https://predictathon.co.uk/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Predictathon" />
    <meta property="og:url" content="https://predictathon.co.uk/" />
    <meta property="og:title" content="Predictathon - football score prediction leagues" />
    <meta property="og:description" content="Predict the scores, beat your mates. Prediction leagues for the Premier League, World Cup and Euros - climb the table and take the bragging rights since 1998." />
    <meta property="og:image" content="https://predictathon.co.uk/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Predictathon - predict the scores, beat your mates." />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      The address-bar tint on mobile Chrome and on Safari 15+. Deliberately one tag rather than the
      usual media="(prefers-color-scheme: ...)" pair: those follow the operating system, which here
      is only the default - the site has its own light/dark toggle, and an address bar that stayed
      black behind a page the reader had just switched to light would be the one part of the window
      ignoring them. The boot script below sets it to the mode actually in use before first paint,
      and ColorModeProvider keeps it there afterwards.
    -->
    <meta name="theme-color" content="#1E4FD1" />
  </head>
  <body>
    <script>
      // Sets the color-mode class before first paint, so there's no flash of the wrong theme
      // while React mounts. Runs before any JS module loads, so it can't import
      // src/components/ui/color-mode-context.ts's STORAGE_KEY - this string must be kept in sync
      // with that constant by hand.
      (function () {
        try {
          var stored = localStorage.getItem("predictathon-color-mode");
          var mode = stored === "light" || stored === "dark"
            ? stored
            : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.classList.add(mode);

          // Same hand-sync caveat as the key above: these two colours are THEME_COLORS in
          // src/components/ui/color-mode-context.ts, which this script can't import either.
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) {
            themeColor.setAttribute("content", mode === "dark" ? "#000000" : "#1E4FD1");
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <!--
      The landing page's copy is rendered by React, so a crawler that doesn't execute JavaScript
      sees an empty #root. Google renders JS, but this is the only content-bearing page on the
      site, so it is worth stating the proposition in the served HTML too. Kept in sync by hand
      with LoggedOutLanding's BrandRail.
    -->
    <noscript>
      <h1>Predictathon - predict the scores, beat your mates</h1>
      <p>
        Prediction leagues for your favourite football tournaments - the Premier League, the World
        Cup and the European Championships. Predict each week's scores, earn points for how close
        you get, climb the league table and take the bragging rights. Running since 1998.
      </p>
      <p>Predictathon needs JavaScript enabled to log in and play.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
